[package]
name = "model-tester"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"

[profile.release]
opt-level = 2
lto = true
strip = true
